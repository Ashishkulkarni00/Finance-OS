spring.application.name=finance

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
# 'local' holds developer machine settings including the DB password and is
# gitignored. Production supplies DB_* environment variables instead.
spring.profiles.default=local

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
# Credentials NEVER live in this file. Environment first, local profile second.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finance_planner?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# No explicit dialect: Hibernate 7 removed MySQL8Dialect and auto-detects the
# server version correctly. See ADR-0002.
# validate (not update): Flyway owns the schema. See ADR-0003.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# Web / errors
# ---------------------------------------------------------------------------
# Never leak internals to clients. GlobalExceptionHandler produces every error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Disabled deliberately: Spring's built-in ProblemDetails advice would otherwise win
# ordering against GlobalExceptionHandler and strip our field errors and error codes.
spring.mvc.problemdetails.enabled=false

# ---------------------------------------------------------------------------
# Money
# ---------------------------------------------------------------------------
# BigDecimal is serialised as a JSON string by MoneySerializer (see ADR-0001).
spring.jackson.default-property-inclusion=non_null


