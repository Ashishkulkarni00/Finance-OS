# Integration tests run against a real local MySQL schema, not H2.
# H2 disagrees with MySQL on DECIMAL, dates and locking - precisely where this
# application is sensitive. See ADR-0007.
#
# Create once:  CREATE DATABASE finance_planner_test;
#
# Credentials NEVER live in this file. Environment variables first, then the
# gitignored application-test-local.properties (copy the .example next to it).
spring.config.import=optional:classpath:application-test-local.properties
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/finance_planner_test?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
